name: Smoke tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ayodo-face-type:test .
      - name: Run smoke tests
        run: docker run --rm ayodo-face-type:test python -m unittest discover -s tests -v
